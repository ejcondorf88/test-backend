# Serenity BDD Configuration
# Documentation: https://serenity-bdd.github.io/docs/serenity/system-props

webdriver {
  driver = chrome
  autodownload = true
}

headless.mode = false

serenity {
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
  # Optional: reporting configuration
  report {
    accessibility = true
  }
}

# Chrome options
chrome.switches = "--start-maximized;--remote-allow-origins=*"

# Base URLs por entorno
environments {
  default {
    webdriver.base.url = "http://localhost:8080"
  }
  dev {
    webdriver.base.url = "http://dev.example.com"
  }
  staging {
    webdriver.base.url = "http://staging.example.com"
  }
}

# Timeouts
webdriver.timeouts.implicitlywait = 5000
